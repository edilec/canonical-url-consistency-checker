<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Pricing</title>
    <!-- A commented-out canonical must not be read as a declaration:
         <link rel="canonical" href="https://wrong.example.org/pricing"> -->
    <link rel="canonical" href="https://example.com/pricing">
    <script>
      // Nor must one that only appears inside a script string.
      const template = '<link rel="canonical" href="https://wrong.example.org/pricing">'
    </script>
  </head>
  <body>
    <h1>Pricing</h1>
  </body>
</html>
